<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gretchen</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80' fill='%23d97757'>✻</text></svg>" />
  <!-- apply saved style prefs before first paint so there's no flash; light
       theme, terminal font, and circle checkboxes are the defaults -->
  <script>try{var r=document.documentElement.classList;if(localStorage.getItem('gretchen-theme')!=='dark')r.add('theme-light');if(localStorage.getItem('gretchen-font')==='minimal')r.add('font-minimal');if(localStorage.getItem('gretchen-checkbox')==='square')r.add('checkbox-square');if(localStorage.getItem('gretchen-collapse')==='hide')r.add('collapse-hide');if(localStorage.getItem('gretchen-collapse-trigger')==='button')r.add('collapse-by-button')}catch(e){}</script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-name"><span class="spark">✻</span> Gretchen</span>
        <button class="sidebar-toggle" title="collapse sidebar" aria-label="toggle sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <rect x="2.5" y="3.5" width="19" height="17" rx="3.5" stroke="currentColor" stroke-width="1.6"/>
            <line x1="9" y1="3.5" x2="9" y2="20.5" stroke="currentColor" stroke-width="1.6"/>
            <rect class="panel-fill" x="3.4" y="4.4" width="4.8" height="15.2" rx="1.6" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <nav id="nav-views">
        <button class="navbtn active" data-view="board"><span class="navicon">📥</span> inbox</button>
        <button class="navbtn" data-view="calendar"><span class="navicon">📅</span> calendar</button>
        <button class="navbtn" data-view="kanban"><span class="navicon">📊</span> kanban</button>
        <button class="navbtn" data-view="archive"><span class="navicon">🗄️</span> archive</button>
        <button class="navbtn" data-view="time"><span class="navicon">🕐</span> time log</button>
        <button class="navbtn" data-view="settings"><span class="navicon">⚙️</span> settings</button>
      </nav>
      <div id="wellness" class="side-section"></div>
      <div class="side-section">
        <div class="side-head collapsible" id="projects-head">
          <span class="side-head-label">projects</span>
          <button id="new-project" title="new project">+</button>
        </div>
        <div id="projects"></div>
      </div>
      <div class="side-section">
        <div class="side-head collapsible" id="tags-head">
          <span class="side-head-label">tags</span>
        </div>
        <div id="tags"></div>
      </div>
      <div id="stats" class="side-section dim"></div>
    </aside>

    <main id="main">
      <div id="topbar">
        <button id="sidebar-toggle" class="sidebar-toggle" title="show sidebar" aria-label="toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
            <rect x="2.5" y="3.5" width="19" height="17" rx="3.5" stroke="currentColor" stroke-width="1.6"/>
            <line x1="9" y1="3.5" x2="9" y2="20.5" stroke="currentColor" stroke-width="1.6"/>
            <rect class="panel-fill" x="3.4" y="4.4" width="4.8" height="15.2" rx="1.6" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div id="timerbar" class="hidden"></div>

      <section id="view-board" class="view">
        <div id="board-head">
          <h1 id="board-title">inbox</h1>
          <span id="tag-filter" class="hidden"></span>
        </div>
        <div id="tasks"></div>
        <div id="promptwrap">
          <div id="suggest" class="hidden"></div>
          <div id="promptbox">
            <span class="caret">❯</span>
            <input id="prompt" autocomplete="off" spellcheck="false"
              placeholder='add a task — "ship report due friday #work" · / for commands' />
          </div>
          <div id="hint" class="dim">↑/↓ select · ⇧↑/↓ move · ⇧←/→ nest · ⌫ delete · enter done · ⇧N add · / commands</div>
        </div>
      </section>

      <section id="view-calendar" class="view hidden">
        <div id="cal-head">
          <button id="cal-prev" title="previous (shift+←)">‹</button>
          <h1 id="cal-title"></h1>
          <button id="cal-next" title="next (shift+→)">›</button>
          <button id="cal-today" title="jump to today (t)">today</button>
          <span class="spacer"></span>
          <span id="cal-modes">
            <button class="cal-mode" data-mode="month" title="month view (m)">month</button>
            <button class="cal-mode" data-mode="week" title="week view (w)">week</button>
            <button class="cal-mode" data-mode="day" title="day view (d)">day</button>
          </span>
        </div>
        <div id="cal-grid"></div>
        <div id="cal-foot" class="dim"></div>
      </section>

      <section id="view-kanban" class="view hidden">
        <div id="kanban-head">
          <h1>kanban</h1>
          <span id="kanban-filter" class="hidden"></span>
          <span class="spacer"></span>
        </div>
        <div id="kanban-board"></div>
      </section>

      <section id="view-archive" class="view hidden">
        <h1>archive</h1>
        <div id="archive-list"></div>
      </section>

      <section id="view-time" class="view hidden">
        <h1>time log</h1>
        <div id="toggl-box" class="toggl-box"></div>
        <div id="time-summary"></div>
        <table id="time-table"></table>
        <div class="dim" id="time-path"></div>
        <div id="time-email">
          <label>email for Toggl import: <input id="email-input" placeholder="you@example.com" /></label>
          <button id="email-save">save</button>
        </div>
      </section>

      <section id="view-settings" class="view hidden">
        <h1>settings</h1>
        <div id="settings-body"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
